<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   STRATEGY BOT 369 — Digit Frequency Trading Command Center
   Rebuilt on Deriv's Options API (api.derivws.com/trading/v1/options)
   Verified flow (confirmed directly with Deriv support):
     1) GET  /trading/v1/options/accounts            -> accountId
     2) POST /trading/v1/options/accounts/{id}/otp    -> one-time wss:// URL
     3) connect to that wss:// URL
     4) send {"authorize": "<Personal Access Token>"} and wait for response
     5) proposal -> buy -> proposal_open_contract (subscribe)
     6) ticks/active_symbols/contracts_for are public, same shape as before
     If the socket drops: get a FRESH OTP, reconnect, re-authorize.
   ============================================================ */

const EVEN = [0, 2, 4, 6, 8];
const ODD = [1, 3, 5, 7, 9];
const MARKETS = ["R_10", "R_25", "R_50", "R_75", "R_100"];
const OPTIONS_API = "https://api.derivws.com/trading/v1/options";
const WS_PUBLIC = "wss://api.derivws.com/trading/v1/options/ws/public";

const glass =
  "backdrop-blur-xl bg-white/[0.04] ring-1 ring-white/10 shadow-2xl rounded-3xl";

function clamp(n, a, b) {
  return Math.max(a, Math.min(b, n));
}

/* ---------- Animated number ---------- */
function AnimatedNumber({ value, decimals = 1, suffix = "" }) {
  const [display, setDisplay] = useState(value);
  const raf = useRef();
  useEffect(() => {
    const start = display;
    const delta = value - start;
    const t0 = performance.now();
    const dur = 280;
    function step(t) {
      const p = clamp((t - t0) / dur, 0, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(start + delta * eased);
      if (p < 1) raf.current = requestAnimationFrame(step);
    }
    raf.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf.current);
    // eslint-disable-next-line
  }, [value]);
  return (
    <span>
      {display.toFixed(decimals)}
      {suffix}
    </span>
  );
}

/* ---------- Digit cell ---------- */
function DigitCell({ digit, pct, isCandidate, flash, cursorLabel, isEven, selectable, selected, onSelect }) {
  const hue = isEven ? "56,189,248" : "251,113,133";
  const glowStrength = isCandidate ? 0.55 : flash ? 0.35 : 0.12;
  return (
    <div
      onClick={selectable ? onSelect : undefined}
      className={`relative flex-1 rounded-2xl px-2 py-3 flex flex-col items-center justify-center overflow-hidden transition-all duration-300 ${
        selectable ? "cursor-pointer active:scale-95" : ""
      }`}
      style={{
        background: `radial-gradient(120% 140% at 50% -10%, rgba(${hue},${glowStrength}) 0%, rgba(15,15,20,0.9) 70%)`,
        border: selected
          ? "2px solid #f5f6f8"
          : `1px solid rgba(${hue}, ${isCandidate ? 0.9 : flash ? 0.6 : 0.2})`,
        boxShadow: selected
          ? "0 0 22px rgba(245,246,248,0.7), inset 0 0 14px rgba(245,246,248,0.2)"
          : isCandidate
          ? `0 0 28px rgba(${hue},0.55), inset 0 0 20px rgba(${hue},0.15)`
          : flash
          ? `0 0 16px rgba(${hue},0.35)`
          : "none",
      }}
    >
      {selected && (
        <div className="absolute top-1 left-1 text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-white text-[#0a0a10]">
          SEL
        </div>
      )}
      {cursorLabel && (
        <div
          className="absolute top-1 right-1 text-[9px] font-bold px-1.5 py-0.5 rounded-full"
          style={{ background: `rgba(${hue},0.9)`, color: "#0a0a0f" }}
        >
          {cursorLabel}
        </div>
      )}
      <div className="text-xs font-semibold tracking-wide" style={{ color: `rgba(${hue},0.95)` }}>
        <AnimatedNumber value={pct} decimals={1} suffix="%" />
      </div>
      <div
        className="text-2xl font-bold mt-0.5"
        style={{ color: "#f5f6f8", textShadow: isCandidate ? `0 0 18px rgba(${hue},0.9)` : "none" }}
      >
        {digit}
      </div>
      <div className="w-full h-1 mt-2 rounded-full bg-white/5 overflow-hidden">
        <div
          className="h-full rounded-full transition-all duration-300"
          style={{
            width: `${clamp(pct * 4, 2, 100)}%`,
            background: `linear-gradient(90deg, rgba(${hue},0.9), rgba(${hue},0.4))`,
          }}
        />
      </div>
    </div>
  );
}

/* ---------- Group strength bar ---------- */
function GroupBar({ label, pct, color, isWeak, band }) {
  const inBand = pct >= band[0] && pct <= band[1];
  return (
    <div className={`flex-1 rounded-2xl p-4 ${glass}`}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs uppercase tracking-widest text-white/50 font-semibold">{label}</span>
        {isWeak && (
          <span
            className="text-[10px] font-bold px-2 py-0.5 rounded-full"
            style={{
              background: inBand ? "rgba(250,204,21,0.15)" : "rgba(248,113,113,0.15)",
              color: inBand ? "#facc15" : "#f87171",
              boxShadow: inBand ? "0 0 12px rgba(250,204,21,0.4)" : "none",
            }}
          >
            {inBand ? "WEAK · IN BAND" : "OUT OF BAND"}
          </span>
        )}
      </div>
      <div className="text-3xl font-bold mb-2" style={{ color, textShadow: `0 0 20px ${color}66` }}>
        <AnimatedNumber value={pct} decimals={2} suffix="%" />
      </div>
      <div className="relative w-full h-2.5 rounded-full bg-white/5 overflow-hidden">
        <div
          className="absolute top-0 bottom-0 rounded-full transition-all duration-300"
          style={{
            width: `${pct}%`,
            background: `linear-gradient(90deg, ${color}55, ${color})`,
            boxShadow: `0 0 14px ${color}88`,
          }}
        />
        <div className="absolute top-0 bottom-0 w-px bg-yellow-300/60" style={{ left: `${band[0]}%` }} />
        <div className="absolute top-0 bottom-0 w-px bg-red-400/60" style={{ left: `${band[1]}%` }} />
      </div>
    </div>
  );
}

/* ---------- Strategy Engine (pure function of state) ---------- */
function useStrategyEngine(settings) {
  const [ticks, setTicks] = useState([]);
  const [phase, setPhase] = useState("scanning");
  const [candidate, setCandidate] = useState(null);
  const [weakGroup, setWeakGroup] = useState(null);
  const [armPct, setArmPct] = useState(null);
  const [cursorVals, setCursorVals] = useState([null, null, null]);
  const [cursorTicks, setCursorTicks] = useState([null, null, null]);
  const [confidence, setConfidence] = useState(0);
  const [rejectReason, setRejectReason] = useState(null);
  const [readySignal, setReadySignal] = useState(null);
  const cursorIndexRef = useRef(0);

  const reset = useCallback((reason) => {
    setPhase("scanning");
    setCandidate(null);
    setWeakGroup(null);
    setArmPct(null);
    setCursorVals([null, null, null]);
    setCursorTicks([null, null, null]);
    setConfidence(0);
    setReadySignal(null);
    cursorIndexRef.current = 0;
    if (reason) setRejectReason(reason);
  }, []);

  const analyze = useCallback((window) => {
    const counts = new Array(10).fill(0);
    window.forEach((d) => counts[d]++);
    const total = window.length;
    const evenPct = (EVEN.reduce((s, d) => s + counts[d], 0) / total) * 100;
    const oddPct = (ODD.reduce((s, d) => s + counts[d], 0) / total) * 100;
    const pcts = counts.map((c) => (c / total) * 100);
    return { counts, evenPct, oddPct, pcts };
  }, []);

  const pushTick = useCallback(
    (digit) => {
      setTicks((prev) => {
        const next = [...prev, digit].slice(-settings.windowSize);
        if (next.length < settings.windowSize) return next;

        const { counts, evenPct, oddPct, pcts } = analyze(next);
        const weak = evenPct <= oddPct ? "even" : "odd";
        const weakGroupDigits = weak === "even" ? EVEN : ODD;
        const weakPct = weak === "even" ? evenPct : oddPct;
        const globalMin = Math.min(...pcts);
        const weakMin = Math.min(...weakGroupDigits.map((d) => pcts[d]));
        const candDigit = weakGroupDigits.find((d) => pcts[d] === weakMin);

        if (phase === "scanning") {
          const globalCandCount = counts[candDigit];
          const isGlobalMin = pcts[candDigit] === globalMin;
          const triggerOk = globalCandCount >= 1 && globalCandCount <= settings.triggerLevel;
          if (isGlobalMin && triggerOk && weakPct >= settings.floor && weakPct <= settings.ceiling) {
            setWeakGroup(weak);
            setCandidate(candDigit);
            setArmPct(weakPct);
            setPhase("c1");
            cursorIndexRef.current = 0;
          }
          return next;
        }

        const wgDigits = weakGroup === "even" ? EVEN : ODD;
        const tickDigit = digit;
        const candCount = counts[candidate];

        if (!wgDigits.includes(tickDigit)) {
          reset("Tick outside weak group — sequence broken, restarting search.");
          return next;
        }

        const currentWeakPct = weakGroup === "even" ? evenPct : oddPct;

        if (currentWeakPct > settings.ceiling || currentWeakPct < settings.floor) {
          reset(`Weak group left the ${settings.floor}%–${settings.ceiling}% band (${currentWeakPct.toFixed(1)}%). Setup killed.`);
          return next;
        }

        const idx = cursorIndexRef.current;

        if (idx === 0) {
          setCursorVals((v) => { const nv = [...v]; nv[0] = currentWeakPct; return nv; });
          setCursorTicks((v) => { const nv = [...v]; nv[0] = tickDigit; return nv; });
          cursorIndexRef.current = 1;
          setPhase("c2");
          return next;
        }

        if (idx === 1) {
          setCursorVals((v) => { const nv = [...v]; nv[1] = currentWeakPct; return nv; });
          setCursorTicks((v) => { const nv = [...v]; nv[1] = tickDigit; return nv; });
          cursorIndexRef.current = 2;
          setPhase("c3");
          return next;
        }

        if (idx === 2) {
          if (tickDigit === candidate) {
            reset("Cursor 3 tick equals candidate digit — setup discarded entirely.");
            return next;
          }
          setCursorVals((v) => {
            const c2val = v[1];
            const spiked3 = currentWeakPct > c2val;
            const nv = [...v];
            nv[2] = currentWeakPct;

            if (spiked3) {
              reset("Cursor 3 spiked above cursor 2 — trade rejected.");
              return next;
            }

            const conf = computeConfidence({
              ceiling: settings.ceiling,
              trigger: settings.triggerLevel,
              candCount,
              cursorVals: nv,
              armPct,
            });
            setConfidence(conf);
            if (conf >= settings.confidenceThreshold) {
              setPhase("ready");
              setReadySignal({ weakGroup, candidate, confidence: conf, cursorVals: nv, timestamp: Date.now() });
            } else {
              setPhase("rejected");
              setRejectReason(`Confidence ${conf.toFixed(1)}% below threshold ${settings.confidenceThreshold}%.`);
              setTimeout(() => reset(null), 1200);
            }
            return nv;
          });
          setCursorTicks((v) => { const nv = [...v]; nv[2] = tickDigit; return nv; });
        }

        return next;
      });
    },
    [phase, weakGroup, candidate, armPct, settings, analyze, reset]
  );

  function computeConfidence({ ceiling, trigger, candCount, cursorVals, armPct }) {
    const finalPct = cursorVals[2];
    const headroom = clamp(((ceiling - finalPct) / ceiling) * 100, 0, 100);
    const triggerScore = clamp(((trigger - candCount + 1) / trigger) * 100, 0, 100);
    const series = [armPct, cursorVals[0], cursorVals[1], cursorVals[2]];
    const mean = series.reduce((a, b) => a + b, 0) / series.length;
    const variance = series.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / series.length;
    const stabilityScore = clamp(100 - variance * 6, 0, 100);
    return headroom * 0.4 + triggerScore * 0.3 + stabilityScore * 0.3;
  }

  return {
    ticks, phase, candidate, weakGroup, armPct, cursorVals, cursorTicks,
    confidence, rejectReason, readySignal, pushTick, reset, analyze,
  };
}

/* ---------- Main App ---------- */
function StrategyBot369() {
  const [connection, setConnection] = useState("disconnected");
  const [market, setMarket] = useState("R_10");
  const [availableMarkets, setAvailableMarkets] = useState([]);
  const [appId, setAppId] = useState("");
  const [apiToken, setApiToken] = useState("");
  const [liveMode, setLiveMode] = useState(false);
  const [executionMode, setExecutionMode] = useState("1-trade");
  const [tradeType, setTradeType] = useState("differ");
  const [controlMode, setControlMode] = useState("auto");
  const [autoRunning, setAutoRunning] = useState(false);
  const [accountInfo, setAccountInfo] = useState(null);
  const [contractsAvailable, setContractsAvailable] = useState(null);
  const [authorized, setAuthorized] = useState(false);

  const [settings, setSettings] = useState({
    windowSize: 51, floor: 20, ceiling: 38, triggerLevel: 2,
    confidenceThreshold: 90, stake: 1, maxTrades: 20, maxConsecutiveLosses: 4,
    profitTarget: 50, stopLoss: 30, dailyProfitTarget: 20, dailyLossLimit: 15,
  });

  const [tickStream, setTickStream] = useState([]);
  const [log, setLog] = useState([]);
  const [history, setHistory] = useState([]);
  const [stats, setStats] = useState({
    trades: 0, wins: 0, losses: 0, consecutiveLosses: 0, pnl: 0,
    dailyPnl: 0, day: new Date().toDateString(),
  });
  const [emergencyStop, setEmergencyStop] = useState(false);
  const [flashDigit, setFlashDigit] = useState(null);
  const [manualDigit, setManualDigit] = useState(null);

  const wsRef = useRef(null);
  const engine = useStrategyEngine(settings);
  const lastReadyIdRef = useRef(null);
  const pendingProposalRef = useRef(null);

  function pushLog(msg, kind = "info") {
    setLog((l) => [{ id: Math.random(), t: new Date().toLocaleTimeString(), msg, kind }, ...l].slice(0, 60));
  }

  // ---------- Auth: GET accounts -> POST otp -> connect -> send authorize ----------
  const getOtpWsUrl = async (cleanToken, cleanAppId) => {
    const headers = { Authorization: `Bearer ${cleanToken}`, "Deriv-App-ID": cleanAppId };
    const accRes = await fetch(`${OPTIONS_API}/accounts`, { headers });
    if (!accRes.ok) throw new Error(`Could not list accounts (HTTP ${accRes.status}).`);
    const accBody = await accRes.json();
    const accounts = accBody.data || accBody.accounts || [];
    if (!accounts.length) throw new Error("No Options accounts found for this token.");
    const wantType = liveMode ? "real" : "demo";
    const acct = accounts.find((a) => a.account_type === wantType) || accounts[0];
    setAccountInfo(acct);
    const otpRes = await fetch(`${OPTIONS_API}/accounts/${acct.account_id}/otp`, {
      method: "POST",
      headers,
    });
    if (!otpRes.ok) throw new Error(`Could not get OTP (HTTP ${otpRes.status}).`);
    const otpBody = await otpRes.json();
    if (!otpBody?.data?.url) throw new Error("OTP response had no WebSocket URL.");
    return otpBody.data.url;
  };

  const connect = async () => {
    const cleanToken = (apiToken || "").trim();
    const cleanAppId = (appId || "").trim();
    if (wsRef.current) wsRef.current.close();
    setConnection("connecting");
    setAccountInfo(null);
    setContractsAvailable(null);
    setAuthorized(false);

    if (liveMode && cleanToken && !cleanAppId) {
      pushLog("Enter your Deriv-App-ID alongside the token — required for account/OTP lookups.", "error");
      setConnection("disconnected");
      return;
    }

    let wsUrl = WS_PUBLIC;
    if (liveMode && cleanToken) {
      pushLog("Requesting account + OTP from Deriv...", "success");
      try {
        wsUrl = await getOtpWsUrl(cleanToken, cleanAppId);
      } catch (e) {
        pushLog("Auth setup failed: " + e.message + " — falling back to public (unauthenticated) connection.", "error");
        wsUrl = WS_PUBLIC;
      }
    }

    pushLog(`Connecting to Deriv (${wsUrl === WS_PUBLIC ? "public" : "OTP session"}) — market ${market}...`);
    let ws;
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      pushLog("Failed to open WebSocket: " + e.message, "error");
      setConnection("disconnected");
      return;
    }
    wsRef.current = ws;

    ws.onopen = () => {
      setConnection("connected");
      if (liveMode && cleanToken && wsUrl !== WS_PUBLIC) {
        // Step required per Deriv support: OTP URL alone does NOT authenticate —
        // a separate authorize message must be sent and awaited.
        pushLog("Connected. Authorizing session...", "success");
        ws.send(JSON.stringify({ authorize: cleanToken }));
      } else {
        pushLog("Connected. Checking which markets are available...", "success");
        ws.send(JSON.stringify({ active_symbols: "brief" }));
      }
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);

      if (data.msg_type === "authorize") {
        if (data.error) {
          pushLog("Authorize failed: " + data.error.message, "error");
        } else {
          setAuthorized(true);
          pushLog("Authorized — session is now trade-ready.", "success");
          ws.send(JSON.stringify({ active_symbols: "brief" }));
        }
      }

      if (data.msg_type === "active_symbols") {
        if (data.error) {
          pushLog("Could not fetch available markets: " + data.error.message, "error");
        } else {
          const synth = (data.active_symbols || []).filter(
            (s) => s.market === "synthetic_index" && /^R_\d+$/.test(s.symbol)
          );
          if (synth.length === 0) {
            pushLog(
              "No R_10-R_100 volatility indices are available on this account/region — check which markets show under Synthetic Indices in the regular Deriv Trader app for this account.",
              "error"
            );
          } else {
            const list = synth.map((s) => ({ symbol: s.symbol, name: s.display_name }));
            setAvailableMarkets(list);
            pushLog(`${list.length} volatility index market(s) available: ${list.map((m) => m.symbol).join(", ")}.`, "success");
            const stillValid = list.some((m) => m.symbol === market);
            const useMarket = stillValid ? market : list[0].symbol;
            if (!stillValid) {
              setMarket(useMarket);
              pushLog(`"${market}" isn't available — switched to ${useMarket}.`, "warn");
            }
            ws.send(JSON.stringify({ ticks: useMarket, subscribe: 1 }));
            ws.send(JSON.stringify({ contracts_for: useMarket }));
          }
        }
      }

      if (data.msg_type === "contracts_for") {
        if (data.error) {
          pushLog("Could not check contract availability: " + data.error.message, "error");
        } else {
          const types = new Set((data.contracts_for?.available || []).map((c) => c.contract_type));
          setContractsAvailable(types);
          const wanted = tradeType === "differ" ? ["DIGITDIFF"] : ["DIGITEVEN", "DIGITODD"];
          const missing = wanted.filter((t) => !types.has(t));
          if (missing.length) {
            pushLog(`This market/account doesn't offer ${missing.join(", ")} — ${tradeType === "differ" ? "Digit Differs" : "Even/Odd"} trades will be blocked here.`, "error");
          } else {
            pushLog(`${tradeType === "differ" ? "Digit Differs" : "Even/Odd"} contracts confirmed available on ${market}.`, "success");
          }
        }
      }

      if (data.msg_type === "tick" && data.tick) {
        const quote = data.tick.quote.toString();
        const lastDigit = parseInt(quote[quote.length - 1], 10);
        setTickStream((s) => [lastDigit, ...s].slice(0, 40));
        setFlashDigit(lastDigit);
        engine.pushTick(lastDigit);
      }

      if (data.msg_type === "proposal") {
        if (data.error) {
          pushLog("Proposal rejected: " + data.error.message, "error");
          pendingProposalRef.current = null;
        } else if (pendingProposalRef.current) {
          const { stake } = pendingProposalRef.current;
          ws.send(JSON.stringify({ buy: data.proposal.id, price: stake }));
        }
      }

      if (data.msg_type === "buy") {
        if (data.error) {
          pushLog("Trade rejected by Deriv: " + data.error.message, "error");
        } else {
          pushLog(`Trade placed — contract ${data.buy.contract_id}`, "success");
          ws.send(JSON.stringify({ proposal_open_contract: 1, contract_id: data.buy.contract_id, subscribe: 1 }));
        }
      }

      if (data.error) {
        pushLog("Error: " + data.error.message, "error");
      }
    };

    ws.onerror = () => pushLog("WebSocket error.", "error");
    ws.onclose = () => {
      setConnection("disconnected");
      setAuthorized(false);
      pushLog("Disconnected." + (liveMode ? " OTP sessions are single-use — reconnect to get a fresh one." : ""), "warn");
    };
  };

  const disconnect = () => {
    wsRef.current?.close();
    setConnection("disconnected");
  };

  useEffect(() => {
    const iv = setInterval(() => {
      const today = new Date().toDateString();
      setStats((s) => (s.day !== today ? { ...s, day: today, dailyPnl: 0 } : s));
    }, 60000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => () => wsRef.current?.close(), []);

  useEffect(() => {
    if (!flashDigit && flashDigit !== 0) return;
    const t = setTimeout(() => setFlashDigit(null), 350);
    return () => clearTimeout(t);
  }, [flashDigit]);

  const riskBlockReason = useCallback(() => {
    if (emergencyStop) return "Emergency stop engaged — trade blocked.";
    if (stats.trades >= settings.maxTrades) return "Max trades reached — trade blocked.";
    if (stats.consecutiveLosses >= settings.maxConsecutiveLosses) return "Max consecutive losses reached — trade blocked.";
    if (stats.pnl >= settings.profitTarget) return "Profit target reached — trade blocked.";
    if (stats.pnl <= -settings.stopLoss) return "Stop loss hit — trade blocked.";
    if (stats.dailyPnl >= settings.dailyProfitTarget) return "Daily profit target reached — trade blocked.";
    if (stats.dailyPnl <= -settings.dailyLossLimit) return "Daily loss limit hit — trade blocked.";
    return null;
  }, [emergencyStop, stats, settings]);

  const fireTrade = useCallback(
    (cand, wg, confidence) => {
      const blocked = riskBlockReason();
      if (blocked) { pushLog(blocked, "warn"); return; }
      if (cand === null || cand === undefined) { pushLog("No target digit selected — trade blocked.", "warn"); return; }
      const conf = confidence ?? 0;
      let contract_type, barrier;
      if (tradeType === "differ") {
        contract_type = "DIGITDIFF";
        barrier = String(cand);
      } else {
        contract_type = wg === "even" ? "DIGITODD" : "DIGITEVEN";
        barrier = undefined;
      }
      if (contractsAvailable && !contractsAvailable.has(contract_type)) {
        pushLog(`${contract_type} isn't offered on ${market} for this account — trade blocked.`, "error");
        return;
      }
      pushLog(`Executing — ${contract_type}${barrier ? " barrier " + barrier : ""} on ${market}, confidence ${conf.toFixed(1)}%.`, "success");
      const contracts = executionMode === "2-trade" ? 2 : 1;
      for (let i = 0; i < contracts; i++) {
        if (liveMode && authorized && wsRef.current && connection === "connected") {
          pendingProposalRef.current = { stake: settings.stake };
          const proposalReq = {
            proposal: 1, amount: settings.stake, basis: "stake", contract_type,
            currency: "USD", duration: 1, duration_unit: "t", underlying_symbol: market,
          };
          if (barrier !== undefined) proposalReq.barrier = barrier;
          wsRef.current.send(JSON.stringify(proposalReq));
        }
      }
      const win = Math.random() < conf / 100 || (!conf && Math.random() < 0.5);
      const pnlDelta = win ? settings.stake * 0.9 : -settings.stake;
      const today = new Date().toDateString();
      setStats((s) => {
        const isNewDay = s.day !== today;
        const baseDailyPnl = isNewDay ? 0 : s.dailyPnl;
        return {
          trades: s.trades + 1, wins: s.wins + (win ? 1 : 0), losses: s.losses + (win ? 0 : 1),
          consecutiveLosses: win ? 0 : s.consecutiveLosses + 1,
          pnl: +(s.pnl + (liveMode ? 0 : pnlDelta)).toFixed(2),
          dailyPnl: +(baseDailyPnl + (liveMode ? 0 : pnlDelta)).toFixed(2),
          day: today,
        };
      });
      setHistory((h) => [{
        id: Math.random(), time: new Date().toLocaleTimeString(), digit: barrier ?? "—",
        group: wg ?? "—", confidence: conf.toFixed(1),
        outcome: liveMode ? "sent" : win ? "win" : "loss",
        pnl: liveMode ? "—" : (win ? "+" : "") + (win ? (settings.stake * 0.9).toFixed(2) : -settings.stake.toFixed(2)),
      }, ...h].slice(0, 100));
    },
    [riskBlockReason, executionMode, liveMode, authorized, connection, market, settings, tradeType, contractsAvailable]
  );

  useEffect(() => {
    if (!engine.readySignal) return;
    if (lastReadyIdRef.current === engine.readySignal.timestamp) return;
    lastReadyIdRef.current = engine.readySignal.timestamp;
    const { candidate: cand, weakGroup: wg, confidence } = engine.readySignal;
    if (controlMode === "auto") {
      if (autoRunning) fireTrade(cand, wg, confidence);
      setTimeout(() => engine.reset(null), 400);
    } else {
      pushLog(`Signal ready — digit ${cand} (${wg} group), confidence ${confidence.toFixed(1)}%. Press Execute Trade to fire, or select a different digit.`, "success");
      setManualDigit((d) => (d === null ? cand : d));
      setTimeout(() => engine.reset(null), 400);
    }
    // eslint-disable-next-line
  }, [engine.readySignal]);

  const { pcts } = engine.ticks.length === settings.windowSize ? engine.analyze(engine.ticks) : { pcts: new Array(10).fill(0) };
  const evenPct = EVEN.reduce((s, d) => s + pcts[d], 0);
  const oddPct = ODD.reduce((s, d) => s + pcts[d], 0);
  const weak = engine.weakGroup;

  const phaseLabel = {
    scanning: "Scanning for setup…", c1: "Waiting for Cursor 1…", c2: "Waiting for Cursor 2…",
    c3: "Waiting for Cursor 3…", ready: "READY — Executing", rejected: "Rejected",
  }[engine.phase] || "Idle";

  const cursorLabelFor = (d) => {
    if (engine.candidate === d) return null;
    if (engine.cursorTicks[0] === d && engine.phase !== "scanning") return "C1";
    if (engine.cursorTicks[1] === d) return "C2";
    if (engine.cursorTicks[2] === d) return "C3";
    return null;
  };

  return (
    <div
      className="min-h-screen w-full text-white p-4 md:p-6"
      style={{
        background: "radial-gradient(120% 100% at 10% 0%, #131722 0%, #0a0a10 55%, #050507 100%)",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif",
      }}
    >
      {/* TOP STRIP */}
      <div className={`${glass} p-4 mb-4 flex flex-wrap items-center gap-4`}>
        <div className="flex items-center gap-3">
          <div
            className="w-3 h-3 rounded-full"
            style={{
              background: connection === "connected" ? "#34d399" : connection === "connecting" ? "#facc15" : "#f87171",
              boxShadow: `0 0 10px ${connection === "connected" ? "#34d399" : connection === "connecting" ? "#facc15" : "#f87171"}`,
            }}
          />
          <div>
            <div className="font-bold tracking-tight text-lg">STRATEGY BOT 369</div>
            <div className="text-[11px] text-white/40 uppercase tracking-widest">
              {connection}{liveMode && authorized ? " · authorized" : ""}
            </div>
          </div>
        </div>

        <div className="flex items-center gap-2 ml-auto flex-wrap">
          <select
            value={market}
            onChange={(e) => {
              const newMarket = e.target.value;
              setMarket(newMarket);
              if (connection === "connected" && wsRef.current) {
                wsRef.current.send(JSON.stringify({ forget_all: "ticks" }));
                wsRef.current.send(JSON.stringify({ ticks: newMarket, subscribe: 1 }));
                engine.reset(null);
              }
            }}
            className="bg-white/5 rounded-xl px-3 py-2 text-sm ring-1 ring-white/10 outline-none"
          >
            {(availableMarkets.length ? availableMarkets.map((m) => m.symbol) : MARKETS).map((m) => (
              <option key={m} value={m} className="bg-[#111]">{m}</option>
            ))}
          </select>
          <input
            value={appId}
            onChange={(e) => setAppId(e.target.value)}
            placeholder="Deriv-App-ID"
            className="bg-white/5 rounded-xl px-3 py-2 text-sm ring-1 ring-white/10 outline-none w-28"
            title="From api.deriv.com/dashboard — your registered app's ID, required alongside the token for account/OTP lookups"
          />
          <input
            value={apiToken}
            onChange={(e) => setApiToken(e.target.value)}
            placeholder="Personal Access Token (trade permission)"
            type="password"
            className="bg-white/5 rounded-xl px-3 py-2 text-sm ring-1 ring-white/10 outline-none w-64"
            title="From Deriv account settings — create a token with 'trade' permission"
          />
          {accountInfo && (
            <span className="text-xs text-white/40 px-1">{accountInfo.account_id} ({accountInfo.account_type})</span>
          )}
          <button
            onClick={() => setLiveMode((v) => !v)}
            className="rounded-xl px-3 py-2 text-sm font-semibold ring-1 ring-white/10"
            style={{
              background: liveMode ? "rgba(248,113,113,0.15)" : "rgba(52,211,153,0.15)",
              color: liveMode ? "#f87171" : "#34d399",
            }}
          >
            {liveMode ? "LIVE" : "DEMO"}
          </button>
          {connection === "connected" ? (
            <button onClick={disconnect} className="rounded-xl px-4 py-2 text-sm font-semibold bg-white/10 ring-1 ring-white/10">
              Disconnect
            </button>
          ) : (
            <button
              onClick={connect}
              className="rounded-xl px-4 py-2 text-sm font-semibold"
              style={{ background: "linear-gradient(135deg,#38bdf8,#818cf8)", boxShadow: "0 0 20px rgba(56,189,248,0.4)" }}
            >
              Connect
            </button>
          )}
        </div>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
        {/* PREDICTION COMMAND CENTER + STRATEGY PARAMS */}
        <div className={`${glass} p-5 xl:col-span-1 flex flex-col gap-4`}>
          <div className="flex items-center justify-between">
            <div className="text-xs uppercase tracking-widest text-white/40 font-semibold">Prediction Command Center</div>
            <div className="flex items-center gap-2">
              <span
                className="flex items-center gap-1.5 text-[10px] font-bold px-2 py-1 rounded-full"
                style={{
                  background: controlMode === "auto" && autoRunning ? "rgba(52,211,153,0.15)" : "rgba(255,255,255,0.06)",
                  color: controlMode === "auto" && autoRunning ? "#34d399" : "rgba(255,255,255,0.4)",
                }}
              >
                <span
                  className="w-1.5 h-1.5 rounded-full"
                  style={{
                    background: controlMode === "auto" && autoRunning ? "#34d399" : "rgba(255,255,255,0.3)",
                    boxShadow: controlMode === "auto" && autoRunning ? "0 0 8px #34d399" : "none",
                  }}
                />
                {controlMode === "auto" ? (autoRunning ? "AUTO RUNNING" : "AUTO STOPPED") : "MANUAL"}
              </span>
              <button
                onClick={() => setAutoRunning((v) => !v)}
                disabled={controlMode !== "auto"}
                className="text-[11px] font-bold px-2.5 py-1 rounded-full disabled:opacity-30"
                style={{
                  background: autoRunning ? "rgba(248,113,113,0.15)" : "linear-gradient(135deg,#34d399,#38bdf8)",
                  color: autoRunning ? "#f87171" : "#0a0a10",
                }}
              >
                {autoRunning ? "Stop Auto" : "Start Auto"}
              </button>
            </div>
          </div>

          <div
            className="rounded-2xl p-4 flex-1"
            style={{
              background: engine.phase === "ready" ? "linear-gradient(135deg, rgba(52,211,153,0.15), rgba(52,211,153,0.02))" : "rgba(255,255,255,0.03)",
              border: engine.phase === "ready" ? "1px solid rgba(52,211,153,0.5)" : "1px solid rgba(255,255,255,0.06)",
              boxShadow: engine.phase === "ready" ? "0 0 30px rgba(52,211,153,0.35)" : "none",
            }}
          >
            <div className="text-sm font-semibold mb-2" style={{ color: engine.phase === "ready" ? "#34d399" : "#e5e7eb" }}>
              {phaseLabel}
            </div>
            {engine.candidate !== null ? (
              <>
                <div className="flex items-baseline gap-2 mb-1">
                  <span className="text-white/40 text-xs">Weak group</span>
                  <span className="font-bold" style={{ color: weak === "even" ? "#38bdf8" : "#fb7185" }}>{weak?.toUpperCase()}</span>
                </div>
                <div className="flex items-baseline gap-2 mb-1">
                  <span className="text-white/40 text-xs">Target digit</span>
                  <span className="text-3xl font-bold">{engine.candidate}</span>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-white/40 text-xs">Confidence</span>
                  <span className="font-bold text-lg"><AnimatedNumber value={engine.confidence} decimals={1} suffix="%" /></span>
                </div>
              </>
            ) : (
              <div className="text-white/30 text-sm">Waiting for a qualifying setup…</div>
            )}
            {engine.rejectReason && engine.phase === "scanning" && (
              <div className="mt-3 text-xs text-red-300/80">{engine.rejectReason}</div>
            )}
          </div>

          <div className="grid grid-cols-2 gap-2">
            {[
              ["Window", settings.windowSize, "windowSize", "Number of ticks in the sliding sample (default 51)."],
              ["Trigger lvl", settings.triggerLevel, "triggerLevel", "How rare the candidate digit must be to qualify a setup."],
              ["Floor %", settings.floor, "floor", "Minimum allowed weak-group percentage (band floor)."],
              ["Ceiling %", settings.ceiling, "ceiling", "Maximum allowed weak-group percentage (band ceiling)."],
              ["Confidence min", settings.confidenceThreshold, "confidenceThreshold", "Minimum confidence score required to fire a trade."],
              ["Stake", settings.stake, "stake", "Stake amount per contract."],
              ["Daily profit target", settings.dailyProfitTarget, "dailyProfitTarget", "Stop trading for the day once today's P/L reaches this."],
              ["Daily loss limit", settings.dailyLossLimit, "dailyLossLimit", "Stop trading for the day once today's P/L drops to minus this."],
            ].map(([label, val, key, hint]) => (
              <label key={key} className="text-[11px] text-white/40" title={hint}>
                {label}
                <input
                  type="number"
                  value={val}
                  onChange={(e) => setSettings((s) => ({ ...s, [key]: parseFloat(e.target.value) || 0 }))}
                  className="mt-1 w-full bg-white/5 rounded-lg px-2 py-1.5 text-sm ring-1 ring-white/10 outline-none text-white"
                />
              </label>
            ))}
          </div>
          <div className="rounded-xl px-3 py-2 flex items-center justify-between text-xs" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)" }}>
            <span className="text-white/40">Today's P/L</span>
            <span className="font-bold" style={{ color: stats.dailyPnl >= 0 ? "#34d399" : "#f87171" }}>
              {stats.dailyPnl >= 0 ? "+" : ""}{stats.dailyPnl}
            </span>
          </div>
        </div>

        {/* MAIN DASHBOARD */}
        <div className="xl:col-span-2 flex flex-col gap-4">
          <div className={`${glass} p-5`}>
            <div className="flex items-center justify-between mb-3">
              <div className="text-xs uppercase tracking-widest text-white/40 font-semibold">Digit Frequency</div>
              <div className="text-[11px] text-white/30">sample {engine.ticks.length}/{settings.windowSize}</div>
            </div>
            <div className="flex gap-2 mb-2">
              {EVEN.map((d) => (
                <DigitCell key={d} digit={d} pct={pcts[d]} isEven isCandidate={engine.candidate === d}
                  flash={flashDigit === d} cursorLabel={cursorLabelFor(d)} selectable={controlMode === "manual"}
                  selected={controlMode === "manual" && manualDigit === d} onSelect={() => setManualDigit(d)} />
              ))}
            </div>
            <div className="flex gap-2">
              {ODD.map((d) => (
                <DigitCell key={d} digit={d} pct={pcts[d]} isEven={false} isCandidate={engine.candidate === d}
                  flash={flashDigit === d} cursorLabel={cursorLabelFor(d)} selectable={controlMode === "manual"}
                  selected={controlMode === "manual" && manualDigit === d} onSelect={() => setManualDigit(d)} />
              ))}
            </div>
            {controlMode === "manual" && (
              <div className="mt-2 text-[11px] text-white/30">Manual mode — tap any digit to set it as your target for the next Execute Trade.</div>
            )}
          </div>

          <div className="flex flex-col md:flex-row gap-4">
            <GroupBar label="Even Group" pct={evenPct} color="#38bdf8" isWeak={weak === "even"} band={[settings.floor, settings.ceiling]} />
            <GroupBar label="Odd Group" pct={oddPct} color="#fb7185" isWeak={weak === "odd"} band={[settings.floor, settings.ceiling]} />
          </div>

          <div className={`${glass} p-5`}>
            <div className="text-xs uppercase tracking-widest text-white/40 font-semibold mb-3">Execution</div>
            <div className="flex flex-wrap items-center gap-3 mb-4">
              <button
                onClick={() => {
                  const cand = controlMode === "manual" ? manualDigit ?? engine.candidate : engine.candidate;
                  const wg = cand === null ? null : EVEN.includes(cand) ? "even" : "odd";
                  fireTrade(cand, wg, engine.confidence);
                }}
                disabled={emergencyStop}
                className="flex-1 min-w-[160px] px-4 py-3 rounded-xl text-sm font-bold transition-all disabled:opacity-40"
                style={{ background: "linear-gradient(135deg,#34d399,#38bdf8)", color: "#0a0a10", boxShadow: "0 0 24px rgba(52,211,153,0.4)" }}
              >
                EXECUTE TRADE
              </button>
              <button
                onClick={() => setEmergencyStop((v) => !v)}
                className="flex-1 min-w-[160px] px-4 py-3 rounded-xl text-sm font-bold"
                style={{
                  background: emergencyStop ? "#f87171" : "rgba(248,113,113,0.15)",
                  color: emergencyStop ? "#0a0a10" : "#f87171",
                  boxShadow: emergencyStop ? "0 0 20px rgba(248,113,113,0.6)" : "none",
                }}
              >
                {emergencyStop ? "STOPPED" : "EMERGENCY STOP"}
              </button>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex bg-white/5 rounded-xl p-1 ring-1 ring-white/10">
                {[["differ", "Digit Differ"], ["evenodd", "Even/Odd"]].map(([val, label]) => (
                  <button key={val} onClick={() => setTradeType(val)} className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                    style={{ background: tradeType === val ? "linear-gradient(135deg,#fbbf24,#f97316)" : "transparent", color: tradeType === val ? "#0a0a10" : "rgba(255,255,255,0.5)" }}>
                    {label}
                  </button>
                ))}
              </div>
              <div className="flex bg-white/5 rounded-xl p-1 ring-1 ring-white/10">
                {["auto", "manual"].map((m) => (
                  <button key={m} onClick={() => setControlMode(m)} className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all capitalize"
                    style={{ background: controlMode === m ? "linear-gradient(135deg,#34d399,#38bdf8)" : "transparent", color: controlMode === m ? "#0a0a10" : "rgba(255,255,255,0.5)" }}>
                    {m}
                  </button>
                ))}
              </div>
              <div className="flex bg-white/5 rounded-xl p-1 ring-1 ring-white/10">
                {["1-trade", "2-trade"].map((m) => (
                  <button key={m} onClick={() => setExecutionMode(m)} className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                    style={{ background: executionMode === m ? "linear-gradient(135deg,#38bdf8,#818cf8)" : "transparent", color: executionMode === m ? "#0a0a10" : "rgba(255,255,255,0.5)" }}>
                    {m}
                  </button>
                ))}
              </div>
              {controlMode === "manual" && manualDigit !== null && (
                <div className="ml-auto text-xs text-white/50">Target: <span className="font-bold text-white">{manualDigit}</span></div>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* TRADE HISTORY + SYSTEM LOG */}
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
        <div className={`${glass} p-5 xl:col-span-2`}>
          <div className="flex items-center justify-between mb-3">
            <div className="text-xs uppercase tracking-widest text-white/40 font-semibold">Trade History</div>
            <div className="flex gap-4 text-xs">
              <span className="text-white/50">Trades <b className="text-white">{stats.trades}</b></span>
              <span className="text-emerald-400">Wins <b>{stats.wins}</b></span>
              <span className="text-red-400">Losses <b>{stats.losses}</b></span>
              <span className={stats.pnl >= 0 ? "text-emerald-400" : "text-red-400"}>P/L <b>{stats.pnl >= 0 ? "+" : ""}{stats.pnl}</b></span>
            </div>
          </div>
          <div className="max-h-64 overflow-y-auto pr-1">
            <table className="w-full text-xs">
              <thead className="text-white/30 sticky top-0">
                <tr className="text-left">
                  <th className="pb-2 font-medium">Time</th><th className="pb-2 font-medium">Digit</th>
                  <th className="pb-2 font-medium">Group</th><th className="pb-2 font-medium">Conf.</th>
                  <th className="pb-2 font-medium">Outcome</th><th className="pb-2 font-medium">P/L</th>
                </tr>
              </thead>
              <tbody>
                {history.map((h) => (
                  <tr key={h.id} className="border-t border-white/5">
                    <td className="py-1.5 text-white/50">{h.time}</td>
                    <td className="py-1.5 font-bold">{h.digit}</td>
                    <td className="py-1.5 capitalize" style={{ color: h.group === "even" ? "#38bdf8" : "#fb7185" }}>{h.group}</td>
                    <td className="py-1.5">{h.confidence}%</td>
                    <td className="py-1.5 capitalize font-semibold" style={{ color: h.outcome === "win" ? "#34d399" : h.outcome === "loss" ? "#f87171" : "#facc15" }}>{h.outcome}</td>
                    <td className="py-1.5">{h.pnl}</td>
                  </tr>
                ))}
                {history.length === 0 && (
                  <tr><td colSpan={6} className="py-6 text-center text-white/20">No trades yet</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>

        <div className={`${glass} p-5`}>
          <div className="text-xs uppercase tracking-widest text-white/40 font-semibold mb-3">System Log</div>
          <div className="max-h-64 overflow-y-auto flex flex-col gap-1.5 pr-1">
            {log.map((l) => (
              <div key={l.id} className="text-[11px] leading-snug">
                <span className="text-white/25">{l.t}</span>{" "}
                <span style={{ color: l.kind === "error" ? "#f87171" : l.kind === "success" ? "#34d399" : l.kind === "warn" ? "#facc15" : "rgba(255,255,255,0.6)" }}>
                  {l.msg}
                </span>
              </div>
            ))}
            {log.length === 0 && <div className="text-white/20 text-xs">No activity yet</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StrategyBot369 />);
</script>
</body>
</html>
